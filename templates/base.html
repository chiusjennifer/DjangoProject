<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django app</title>
 {% load static %}
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- PWA -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0A0302">
    <link rel="icon" href="{% static 'icon/icon-192x192.png' %}">

    <!-- Service Worker 註冊 -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{% static 'serviceworker.js' %}")
            .then(function(registration) {
                console.log("Service Worker 註冊成功:", registration);
            })
            .catch(function(error) {
                console.log("Service Worker 註冊失敗:", error);
            });
        }
    </script>
</head>
<body>
{% load static %}
<nav class="navbar navbar-expand-lg" style="background-color: #1E9494;">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                 <img src="{% static 'img/salad.png' %}" alt="logo" width="30" height="24">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'classify' %}">飲食辨識</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'record' %}">基本身體資訊紀錄</a></li>
                    <li class="nav-item"><a class="nav-link" href="">每日攝取卡路里紀錄</a></li>
                </ul>
                <ul class="navbar-nav ms-auto"> <!-- 這裡加入 ms-auto 讓這些項目靠右 -->
                    <li class="nav-item">
                        <a href="{% url 'login' %}">
                        <img src="{% static 'img/user.png' %}" alt="User Icon" width="30" height="30">
                        </a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
<div>
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
